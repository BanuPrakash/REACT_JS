<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // High Order function
        // function acception function as argument
        // function returning a function
        
        function memoization(fn) {
            var cache = {};
            return function (arg) {
                if(!cache[arg]){
                    cache[arg] = fn(arg);
                }
                return cache[arg];
            }
        }

        function fibonacci(no) {
            if(no == 1 || no == 0) return no;
            return fibonacci(no - 1) + fibonacci(no -2);
        }

        let memFib = memoization(fibonacci);

        console.time("first");
            console.log(memFib(40));
        console.timeEnd("first");

         console.time("second");
            console.log(memFib(40));
        console.timeEnd("second");
    </script>
</body>
</html>
